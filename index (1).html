<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Змейка</title>
<style>
:root{--bg:#b9c79a;--board:#c9d6ab;--ink:#25321b;--soft:#8fa06f;--btn:#a9b886;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b10;--board:#1b2415;--ink:#b4d77a;--soft:#3d5130;--btn:#243019}}
:root[data-theme="dark"]{--bg:#141b10;--board:#1b2415;--ink:#b4d77a;--soft:#3d5130;--btn:#243019}
html,body{height:100%;margin:0;overflow:hidden;-webkit-touch-callout:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
header{width:100%;max-width:520px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;font-weight:700;font-size:18px}
header span small{font-weight:400;opacity:.7;margin-right:4px}
#pause{font:inherit;color:var(--ink);background:var(--btn);border:2px solid var(--ink);padding:10px 16px;min-height:44px;cursor:pointer}
#wrap{flex:1;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#stage{position:relative}
canvas{display:block;background:var(--board);border:3px solid var(--ink)}
#ov{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:color-mix(in srgb,var(--board) 88%,transparent);text-align:center}
#ov.hide{display:none}
#ov h1{margin:0;font-size:34px;letter-spacing:2px}
#ov p{margin:0;font-size:15px;max-width:80%}
#go{font:inherit;font-weight:700;font-size:18px;color:var(--bg);background:var(--ink);border:0;padding:12px 28px;cursor:pointer}
#pad{--k:clamp(58px,19vw,92px);flex:none;display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(2,var(--k));gap:8px;padding:6px 0 16px}
#pad button{font:inherit;font-size:30px;color:var(--ink);background:var(--btn);border:2px solid var(--ink);cursor:pointer;padding:0;touch-action:manipulation}
#pad button:active{background:var(--ink);color:var(--bg)}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (orientation:landscape) and (max-height:560px){
body{flex-direction:row}
header{width:auto;max-width:none;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:14px;padding:16px 12px}
#wrap{align-self:stretch}
#pad{--k:clamp(48px,26vh,84px);padding:0 14px}
}
</style>
</head>
<body>
<header>
  <span><small>Счёт</small><b id="sc">0</b></span>
  <span><small>Рекорд</small><b id="bs">0</b></span>
  <button id="pause" aria-label="Пауза">Пауза</button>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="ov"><h1 id="t">ЗМЕЙКА</h1><p id="m">Свайпайте по экрану или нажимайте стрелки. Ешьте красные точки.</p><button id="go">Играть</button></div>
  </div>
</div>
<div id="pad">
  <button class="u" data-d="0,-1" aria-label="Вверх">▲</button>
  <button class="l" data-d="-1,0" aria-label="Влево">◀</button>
  <button class="d" data-d="0,1" aria-label="Вниз">▼</button>
  <button class="r" data-d="1,0" aria-label="Вправо">▶</button>
</div>
<script>
const N=20,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let snake,dir,queue,food,score,best=0,speed,timer,state='idle'; // idle | run | pause | over
try{best=+localStorage.getItem('snake-best')||0}catch(e){}
$('bs').textContent=best;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function resize(){
  const w=$('wrap'),s=Math.max(160,Math.floor(Math.min(w.clientWidth-24,w.clientHeight-8)/N)*N);
  const dpr=window.devicePixelRatio||1;
  cv.style.width=cv.style.height=s+'px';
  cv.width=cv.height=Math.round(s*dpr);
  draw();
}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};queue=[];score=0;speed=150;
  $('sc').textContent=0;placeFood();
}
function placeFood(){
  let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function turn(dx,dy){
  if(state==='idle'||state==='over')return;
  if(state==='pause'){return}
  const last=queue.length?queue[queue.length-1]:dir;
  if((last.x===dx&&last.y===dy)||(last.x+dx===0&&last.y+dy===0))return;
  if(queue.length<2)queue.push({x:dx,y:dy});
}
function tick(){
  if(state!=='run')return;
  if(queue.length)dir=queue.shift();
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  const eat=h.x===food.x&&h.y===food.y;
  const body=eat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(s=>s.x===h.x&&s.y===h.y)){return end()}
  snake.unshift(h);
  if(eat){
    score++;speed=Math.max(70,speed-3);$('sc').textContent=score;
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
    if(snake.length>=N*N)return end(true);
    placeFood();
  }else snake.pop();
  draw();
  timer=setTimeout(tick,speed);
}
function start(){
  clearTimeout(timer);reset();state='run';$('pause').textContent='Пауза';$('ov').classList.add('hide');draw();timer=setTimeout(tick,speed);
}
function end(win){
  state='over';clearTimeout(timer);draw();
  if(score>best){best=score;$('bs').textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  $('t').textContent=win?'ПОБЕДА!':'КОНЕЦ ИГРЫ';
  $('m').textContent='Счёт: '+score+(score&&score===best?' — новый рекорд!':'');
  $('go').textContent='Ещё раз';$('ov').classList.remove('hide');
}
function togglePause(){
  if(state==='run'){
    state='pause';clearTimeout(timer);
    $('t').textContent='ПАУЗА';$('m').textContent='Счёт: '+score;$('go').textContent='Продолжить';$('ov').classList.remove('hide');$('pause').textContent='Играть';
  }else if(state==='pause'){
    state='run';$('ov').classList.add('hide');$('pause').textContent='Пауза';timer=setTimeout(tick,speed);
  }
}
function draw(){
  if(!snake){reset()}
  const c=cv.width/N,ink=css('--ink'),soft=css('--soft');
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle=soft;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){ctx.fillRect(x*c+c/2-1,y*c+c/2-1,2,2)}
  // food: small diamond
  ctx.fillStyle='#c4402f';
  const fx=food.x*c,fy=food.y*c,q=c*.18;
  ctx.fillRect(fx+q*2,fy+q,c-q*4,c-q*2);ctx.fillRect(fx+q,fy+q*2,c-q*2,c-q*4);
  // snake: blocky segments, head slightly larger
  snake.forEach((s,i)=>{
    const g=i===0?c*.04:c*.1;
    ctx.fillStyle=ink;ctx.fillRect(s.x*c+g,s.y*c+g,c-g*2,c-g*2);
    if(i>0){ctx.fillStyle=css('--board');ctx.fillRect(s.x*c+c*.38,s.y*c+c*.38,c*.24,c*.24)}
  });
  const h=snake[0];ctx.fillStyle=css('--board');
  const eyes=dir.x?[[.5+.22*dir.x,.28],[.5+.22*dir.x,.72]]:[[.28,.5+.22*dir.y],[.72,.5+.22*dir.y]];
  eyes.forEach(([a,b])=>ctx.fillRect(h.x*c+a*c-c*.08,h.y*c+b*c-c*.08,c*.16,c*.16));
}
// controls
$('go').addEventListener('click',()=>{state==='pause'?togglePause():start()});
$('pause').addEventListener('click',togglePause);
document.querySelectorAll('#pad button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();const[d1,d2]=b.dataset.d.split(',').map(Number);turn(d1,d2)});
});
document.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();if(state==='idle'||state==='over')start();turn(...m)}
  else if(e.key===' '){e.preventDefault();state==='run'||state==='pause'?togglePause():start()}
});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
document.addEventListener('touchmove',e=>{
  e.preventDefault();const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1);
  sx=t.clientX;sy=t.clientY;
},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run')togglePause()});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
if(window.ResizeObserver)new ResizeObserver(resize).observe($('wrap'));
document.addEventListener('contextmenu',e=>e.preventDefault());
resize();
</script>
</body>
</html>
